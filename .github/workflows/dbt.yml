name: Python and dbt
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.verify_dbt --csv tests/fixtures/dbt_revenues.csv --target ci --output-dir benchmarks/results/dbt-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dbt-diagnostics-${{ matrix.os }}
          path: |
            dbt/logs/
            dbt/target/
